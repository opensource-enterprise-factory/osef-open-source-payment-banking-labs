# Gate 2: one multi-tenant simulation API with three isolated fictitious identities.
# Only localhost is exposed; no forwarding to production or outside VirtualBox.
services:
  fraud-003:
    build: .
    init: true
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp
    environment:
      FRAUD003_DB_PATH: /data/fraud003.db
      FRAUD003_BANK_A_KEY: ${FRAUD003_BANK_A_KEY:?Set a unique lab-only secret}
      FRAUD003_PSP_B_KEY: ${FRAUD003_PSP_B_KEY:?Set a unique lab-only secret}
      FRAUD003_MOBILE_C_KEY: ${FRAUD003_MOBILE_C_KEY:?Set a unique lab-only secret}
    ports:
      - "127.0.0.1:8113:8000"
    volumes:
      - fraud003-data:/data
    mem_limit: 384m
    cpus: 0.75
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s
volumes:
  fraud003-data:
