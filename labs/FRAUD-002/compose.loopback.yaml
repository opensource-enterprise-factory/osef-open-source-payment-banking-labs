# OSEF FRAUD-002 — overlay sécurisé du profil Tazama Public (DockerHub).
# Revu sur tazama-stack commit 83e4b12c16986aedfff843ed84b7045ac912ec0a.
# Docker Compose >= 2.24.4 : !override REMPLACE entièrement ports, évitant
# de conserver simultanément les publications originales sur 0.0.0.0.
# L'overlay est versionné dans OSEF, SANS modifier les fichiers upstream Tazama.
services:
  admin-service:
    ports: !override
      - "127.0.0.1:5100:3100"
  batch-ppa:
    ports: !override
      - "127.0.0.1:4100:4100"
    # Healthcheck CMD-SHELL upstream impossible dans cette image sans /bin/sh.
    # Sonde HTTP avec Node.js, disponible comme runtime de l'image distroless.
    # Vérifie la liveness HTTP, pas la disponibilité métier des dépendances.
    healthcheck:
      test:
        - CMD
        - /nodejs/bin/node
        - "-e"
        - "require('http').get('http://127.0.0.1:4100/health',r=>{r.resume();process.exit(r.statusCode===200?0:1)}).on('error',()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 20s
  core-postgres:
    ports: !override
      - "127.0.0.1:15432:5432"
  nats:
    ports: !override
      - "127.0.0.1:14222:4222"
      - "127.0.0.1:16222:6222"
      - "127.0.0.1:18222:8222"
  # Interface de démonstration accessible uniquement depuis le réseau privé VirtualBox.
  # Ne pas publier sur 0.0.0.0 ; adresse confirmée de osef-fraud-01.
  tazama-demo:
    ports: !override
      - "192.168.255.10:3011:3011"
  tms-service:
    ports: !override
      - "127.0.0.1:5000:3000"
  valkey:
    ports: !override
      - "127.0.0.1:16379:6379"
